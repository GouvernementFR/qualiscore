[project]
name = "Qualiscore"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Quentin LIENHARDT", email = "quentin.lienhardt@actimage.com" },
]
dependencies = [
  # Runner
  "pyyaml>=6.0.3",
  # Registry
  "niquests>=3.18.8",
  # DOM
  "camoufox>=0.4.11",
  "beautifulsoup4>=4.14.3",
  # Lighthouse
  "playwright>=1.60.0",
  # Ecoindex
  "ecoindex-scraper>=3.16.0",
]

[dependency-groups]
dev-dependencies = ["ruff>=0.15.14"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pycodestyle errors
  "E",
  # pyflakes
  "F",
  # flake8-logging-format
  "G",
  # isort
  "I",
  # flake8-implicit-str-concat
  "ISC",
  # pylint convention
  "PLC",
  # pylint errors
  "PLE",
  # flake8-simplify
  "SIM",
  # pyupgrade
  "UP",
  # pycodestyle warnings
  "W",
]
ignore = [
  # Do not perform function call `Depends` in argument defaults
  "B008",
  # Line too long
  "E501",
  # Unnecessary dict comprehension
  "C420",
]
